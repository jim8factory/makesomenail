<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サムネイル作成アプリ（高機能版）</title>
<style>
  body { font-family: sans-serif; max-width: 850px; margin: 20px auto; padding: 0 15px; background: #f4f4f9; }
  .controls { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
  .control-group { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  label { width: 130px; font-weight: bold; font-size: 14px; }
  input[type="text"] { flex: 1; padding: 8px; font-size: 16px; min-width: 200px; }
  input[type="range"] { flex: 1; max-width: 200px; }
  canvas { max-width: 100%; border: 1px solid #ccc; background: #ddd; display: block; margin: 0 auto; }
  button { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
  button:hover { background: #0056b3; }
  .sub-label { width: auto; font-weight: normal; font-size: 13px; }
</style>
</head>
<body>

  <h2>サムネイル作成アプリ</h2>

  <div class="controls">
    <div class="control-group">
      <label>1. 画像を選択:</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>
    <div class="control-group">
      <label>2. タイトル:</label>
      <input type="text" id="textInput" placeholder="ここにタイトルを入力" value="衝撃の結末！">
    </div>
    <div class="control-group">
      <label>文字サイズ:</label>
      <input type="range" id="sizeInput" min="20" max="150" value="60">
    </div>
    <div class="control-group">
      <label>文字色 / 縁取り:</label>
      <span class="sub-label">文字:</span><input type="color" id="colorInput" value="#ffffff">
      <span class="sub-label">縁取り:</span><input type="color" id="strokeInput" value="#ff0000">
    </div>
    
    <!-- 追加機能：文字の背景と角丸 -->
    <div class="control-group">
      <label>文字の背景:</label>
      <input type="checkbox" id="bgEnableInput" checked>
      <span class="sub-label">有効</span>
      <input type="color" id="bgColorInput" value="#000000">
      <span class="sub-label">透明度:</span>
      <input type="range" id="bgAlphaInput" min="0" max="1" step="0.05" value="0.7">
    </div>
    <div class="control-group">
      <label>背景の角丸:</label>
      <input type="range" id="bgRadiusInput" min="0" max="50" value="15">
    </div>

    <!-- 追加機能：左右移動・上下移動 -->
    <div class="control-group">
      <label>位置 (左右):</label>
      <input type="range" id="xPosInput" min="0" max="100" value="50">
    </div>
    <div class="control-group">
      <label>位置 (上下):</label>
      <input type="range" id="yPosInput" min="0" max="100" value="50">
    </div>

    <button id="downloadBtn">画像を保存する</button>
  </div>

  <canvas id="canvas"></canvas>

<script>
  const imageInput = document.getElementById('imageInput');
  const textInput = document.getElementById('textInput');
  const sizeInput = document.getElementById('sizeInput');
  const colorInput = document.getElementById('colorInput');
  const strokeInput = document.getElementById('strokeInput');
  
  // 追加要素の取得
  const bgEnableInput = document.getElementById('bgEnableInput');
  const bgColorInput = document.getElementById('bgColorInput');
  const bgAlphaInput = document.getElementById('bgAlphaInput');
  const bgRadiusInput = document.getElementById('bgRadiusInput');
  const xPosInput = document.getElementById('xPosInput');
  const yPosInput = document.getElementById('yPosInput');
  
  const downloadBtn = document.getElementById('downloadBtn');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let currentImage = null;

  // 画像読み込み
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0]; // [0]を追加して確実にファイルを取得
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        draw();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 入力変更時に再描画
  const inputs = [
    textInput, sizeInput, colorInput, strokeInput,
    bgEnableInput, bgColorInput, bgAlphaInput, bgRadiusInput,
    xPosInput, yPosInput
  ];
  inputs.forEach(el => {
    el.addEventListener('input', draw);
  });

  // HEXカラーをRGBAに変換するヘルパー関数
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // 角丸四角形を描画する関数
  function drawRoundRect(ctx, x, y, width, height, radius) {
    // 角丸がボックスの半分を超えないように制限
    const r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // 描画処理
  function draw() {
    if (!currentImage) return;

    canvas.width = currentImage.width;
    canvas.height = currentImage.height;

    // 1. 背景画像の描画
    ctx.drawImage(currentImage, 0, 0);

    const text = textInput.value;
    if (!text) return; // テキストが空ならここで終了

    // 2. テキストサイズと位置の計算
    const scale = canvas.width / 800;
    const fontSize = scale * sizeInput.value;
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const x = (canvas.width * xPosInput.value) / 100;
    const y = (canvas.height * yPosInput.value) / 100;

    // 3. 文字のバックグラウンド（角丸）の描画
    if (bgEnableInput.checked) {
      const metrics = ctx.measureText(text);
      const textWidth = metrics.width;
      const textHeight = fontSize; // 高さの基準

      // 文字周りの余白（パディング）
      const padX = fontSize * 0.4;
      const padY = fontSize * 0.25;

      const boxWidth = textWidth + padX * 2;
      const boxHeight = textHeight + padY * 2;
      const boxX = x - boxWidth / 2;
      const boxY = y - boxHeight / 2;
      const radius = scale * bgRadiusInput.value;

      ctx.fillStyle = hexToRgba(bgColorInput.value, bgAlphaInput.value);
      drawRoundRect(ctx, boxX, boxY, boxWidth, boxHeight, radius);
    }

    // 4. 縁取りの描画
    ctx.lineJoin = 'round';
    ctx.lineWidth = fontSize * 0.15;
    ctx.strokeStyle = strokeInput.value;
    ctx.strokeText(text, x, y);

    // 5. 文字本体の描画
    ctx.fillStyle = colorInput.value;
    ctx.fillText(text, x, y);
  }

  // 画像ダウンロード
  downloadBtn.addEventListener('click', () => {
    if (!currentImage) return alert('先に画像を選択してください');
    const link = document.createElement('a');
    link.download = 'thumbnail.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
