<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サムネイル作成アプリ</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; background: #f4f4f9; }
  .controls { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
  .control-group { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  label { width: 120px; font-weight: bold; }
  input[type="text"] { flex: 1; padding: 8px; font-size: 16px; }
  canvas { max-width: 100%; border: 1px solid #ccc; background: #ddd; display: block; margin: 0 auto; }
  button { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
  button:hover { background: #0056b3; }
</style>
</head>
<body>

  <h2>サムネイル作成アプリ</h2>

  <div class="controls">
    <div class="control-group">
      <label>1. 画像を選択:</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>
    <div class="control-group">
      <label>2. タイトル:</label>
      <input type="text" id="textInput" placeholder="ここにタイトルを入力" value="衝撃の結末！">
    </div>
    <div class="control-group">
      <label>文字サイズ:</label>
      <input type="range" id="sizeInput" min="20" max="150" value="60">
    </div>
    <div class="control-group">
      <label>文字色 / 縁取り:</label>
      <input type="color" id="colorInput" value="#ffffff">
      <input type="color" id="strokeInput" value="#ff0000">
    </div>
    <div class="control-group">
      <label>位置 (上下):</label>
      <input type="range" id="yPosInput" min="0" max="100" value="50">
    </div>
    <button id="downloadBtn">画像を保存する</button>
  </div>

  <canvas id="canvas"></canvas>

<script>
  const imageInput = document.getElementById('imageInput');
  const textInput = document.getElementById('textInput');
  const sizeInput = document.getElementById('sizeInput');
  const colorInput = document.getElementById('colorInput');
  const strokeInput = document.getElementById('strokeInput');
  const yPosInput = document.getElementById('yPosInput');
  const downloadBtn = document.getElementById('downloadBtn');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let currentImage = null;

  // 画像読み込み
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        draw();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 入力変更時に再描画
  [textInput, sizeInput, colorInput, strokeInput, yPosInput].forEach(el => {
    el.addEventListener('input', draw);
  });

  // 描画処理
  function draw() {
    if (!currentImage) return;

    // キャンバスサイズを画像に合わせる
    canvas.width = currentImage.width;
    canvas.height = currentImage.height;

    // 背景画像の描画
    ctx.drawImage(currentImage, 0, 0);

    // テキスト設定
    const fontSize = (canvas.width / 800) * sizeInput.value; // 画像サイズに応じたスケール調整
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const x = canvas.width / 2;
    const y = (canvas.height * yPosInput.value) / 100;

    // 縁取り（視認性アップのため太めに設定）
    ctx.lineJoin = 'round';
    ctx.lineWidth = fontSize * 0.15;
    ctx.strokeStyle = strokeInput.value;
    ctx.strokeText(textInput.value, x, y);

    // 文字本体
    ctx.fillStyle = colorInput.value;
    ctx.fillText(textInput.value, x, y);
  }

  // 画像ダウンロード
  downloadBtn.addEventListener('click', () => {
    if (!currentImage) return alert('先に画像を選択してください');
    const link = document.createElement('a');
    link.download = 'thumbnail.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
